# Configuration as Code: deja Jenkins listo sin pasar por el asistente web.
# Crea el usuario admin y el job "catalogo-videojuegos" apuntando al repositorio
# indicado en la variable de entorno REPO_URL.
jenkins:
  systemMessage: "Jenkins - Entregable 4 CI/CD - Catalogo de Videojuegos (Sosa / Lapetina)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8080/"

jobs:
  - script: >
      pipelineJob('catalogo-videojuegos') {
        description('Pipeline CI/CD del Entregable 4 - build, pruebas unitarias, pruebas de integracion y despliegue en el ambiente de produccion simulado')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url("${REPO_URL}")
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
        triggers {
          scm('H/2 * * * *')
          githubPush()
        }
      }
