spring.application.name=catalogo-videojuegos

# Puerto configurable por variable de entorno (cada ambiente usa uno distinto)
server.port=${SERVER_PORT:8090}

# Persistencia: archivo JSON. En Docker se monta un volumen sobre este directorio.
catalogo.archivo=${CATALOGO_ARCHIVO:datos/juegos.json}

# Identificacion del ambiente que se muestra en la cabecera de la pagina
app.ambiente=${APP_AMBIENTE:DESARROLLO}
app.version=@project.version@

# Endpoint de salud que usa el pipeline como smoke test post-despliegue
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.ambiente=${APP_AMBIENTE:DESARROLLO}
info.app.version=@project.version@

spring.thymeleaf.cache=false
